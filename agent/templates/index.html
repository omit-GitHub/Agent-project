<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GUIAgent 智能视频助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eee;
    --text2: #aaa;
    --user-bubble: #0f3460;
    --agent-bubble: #1e2a4a;
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── Header ─── */
  .header {
    background: var(--surface);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .header .logo {
    font-size: 28px;
    line-height: 1;
  }
  .header .title {
    font-size: 17px;
    font-weight: 600;
  }
  .header .subtitle {
    font-size: 12px;
    color: var(--text2);
  }
  .header .status {
    margin-left: auto;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
  }
  .header .status.connected {
    background: rgba(76, 175, 80, 0.2);
    color: #81c784;
  }
  .header .status.error {
    background: rgba(244, 67, 54, 0.2);
    color: #e57373;
  }

  /* ─── Quick Actions ─── */
  .quick-actions {
    background: var(--surface);
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .quick-actions::-webkit-scrollbar { display: none; }
  .quick-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .quick-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
  }
  .quick-btn:active {
    transform: scale(0.95);
  }

  /* ─── Messages ─── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .msg {
    max-width: 80%;
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--agent-bubble);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: rgba(255,255,255,0.04);
    color: var(--text2);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 12px;
  }
  .msg .tool-tag {
    display: inline-block;
    background: rgba(233, 69, 96, 0.2);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-top: 6px;
  }
  .msg.typing {
    color: var(--text2);
    font-style: italic;
  }
  .msg.typing::after {
    content: '...';
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }
  .msg.error {
    background: rgba(244, 67, 54, 0.15);
    color: #e57373;
  }

  /* ─── Input ─── */
  .input-area {
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    border-top: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area textarea:focus {
    border-color: var(--accent);
  }
  .input-area textarea::placeholder {
    color: var(--text2);
  }
  .send-btn {
    background: var(--accent);
    border: none;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #c73e54; }
  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled {
    background: rgba(255,255,255,0.1);
    cursor: not-allowed;
  }

  /* ─── Responsive ─── */
  @media (max-width: 600px) {
    .msg { max-width: 88%; font-size: 14px; }
    .header { padding: 10px 14px; }
    .quick-actions { padding: 6px 10px; }
    .quick-btn { font-size: 12px; padding: 5px 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="logo">🎬</span>
  <div>
    <div class="title">智能视频助手</div>
    <div class="subtitle">通义千问 · GUIAgent</div>
  </div>
  <div class="status" id="status">连接中...</div>
</div>

<div class="quick-actions" id="quickActions">
  <button class="quick-btn" onclick="quickSend('暂停播放')">⏸ 暂停</button>
  <button class="quick-btn" onclick="quickSend('继续播放')">▶ 播放</button>
  <button class="quick-btn" onclick="quickSend('声音大一点')">🔊 音量+</button>
  <button class="quick-btn" onclick="quickSend('声音小一点')">🔉 音量-</button>
  <button class="quick-btn" onclick="quickSend('静音')">🔇 静音</button>
  <button class="quick-btn" onclick="quickSend('上一集')">⏮ 上一集</button>
  <button class="quick-btn" onclick="quickSend('下一集')">⏭ 下一集</button>
  <button class="quick-btn" onclick="quickSend('亮一点')">☀ 亮度+</button>
  <button class="quick-btn" onclick="quickSend('暗一点')">🌙 亮度-</button>
  <button class="quick-btn" onclick="quickSend('现在在放什么')">📺 在放什么</button>
  <button class="quick-btn" onclick="quickSend('返回')">↩ 返回</button>
  <button class="quick-btn" onclick="resetChat()">🔄 重置</button>
</div>

<div class="messages" id="messages">
  <div class="msg system">你好！我是你的智能视频助手，可以帮你控制电视。试试说"暂停播放"、"声音大一点"、"现在在放什么"等。</div>
</div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="说点什么... (Enter 发送, Shift+Enter 换行)" autofocus></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

let isSending = false;

// ─── 初始化 ───
window.addEventListener('load', () => {
  checkHealth();
  setInterval(checkHealth, 30000);  // 每30秒检查连接
});

// ─── 输入处理 ───
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 自适应输入框高度
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

// ─── 发送消息 ───
async function sendMessage(text) {
  const message = text || inputEl.value.trim();
  if (!message || isSending) return;

  isSending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // 用户消息
  addMessage(message, 'user');

  // 加载提示
  const typingEl = addMessage('正在思考', 'agent typing');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error || `HTTP ${resp.status}`);
    }

    const data = await resp.json();

    // 移除 typing 提示
    typingEl.remove();

    // Agent 回复
    const agentEl = addMessage(data.reply, 'agent');

    // 显示工具调用标签
    if (data.tool_calls && data.tool_calls.length > 0) {
      for (const tc of data.tool_calls) {
        const tag = document.createElement('div');
        tag.className = 'tool-tag';
        tag.textContent = `🔧 ${tc.command}`;
        agentEl.appendChild(tag);
      }
    }

  } catch (err) {
    typingEl.remove();
    addMessage(`出错了: ${err.message}`, 'error');
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function quickSend(text) {
  sendMessage(text);
}

// ─── 重置对话 ───
async function resetChat() {
  try {
    await fetch('/api/reset', { method: 'POST' });
    messagesEl.innerHTML = '';
    addMessage('对话已重置，可以开始新的对话。', 'system');
  } catch (err) {
    addMessage(`重置失败: ${err.message}`, 'error');
  }
}

// ─── 添加消息 ───
function addMessage(text, className) {
  const el = document.createElement('div');
  el.className = `msg ${className}`;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

// ─── 健康检查 ───
async function checkHealth() {
  try {
    const resp = await fetch('/api/health');
    const data = await resp.json();
    if (data.ok) {
      statusEl.textContent = '已连接';
      statusEl.className = 'status connected';
    } else {
      throw new Error('not ok');
    }
  } catch {
    statusEl.textContent = '连接失败';
    statusEl.className = 'status error';
  }
}
</script>

</body>
</html>
